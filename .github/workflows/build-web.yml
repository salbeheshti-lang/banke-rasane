name: Build Web Bundle
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: bun install && cd mini-services/api-service && bun install && cd ../..
      - name: Configure for static export
        run: |
          node -e "const fs=require('fs');let s=fs.readFileSync('next.config.ts','utf8');s=s.replace('output: \"standalone\"','output: \"export\"');s=s.replace(/experimental:[^}]*},?/m,'');fs.writeFileSync('next.config.ts',s)"
      - name: Remove API routes
        run: rm -rf src/app/api
      - name: Build
        run: bun run next build || npx next build
        env: { NEXT_TELEMETRY_DISABLED: '1' }
      - name: Bundle API service
        run: |
          mkdir -p out/api-service
          cp mini-services/api-service/index.js out/api-service/
          cp mini-services/api-service/package.json out/api-service/
          cp mini-services/api-service/bankresaneh.sqlite out/api-service/ 2>/dev/null || true
          cp public/talk-shows-data.json out/api-service/ 2>/dev/null || true
      - name: Create ZIP
        run: cd out && zip -r ../BankResaneh-Web.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: BankResaneh-Web-Bundle, path: BankResaneh-Web.zip, if-no-files-found: error }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: BankResaneh-Web.zip, name: بانک رسانه ${{ github.ref_name }}, draft: false, prerelease: false }
