name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build Next.js
      run: npx next build
    
    - name: Copy static files
      shell: pwsh
      run: |
        Copy-Item -Path ".next\static" -Destination ".next\standalone\.next\static" -Recurse -Force
        Copy-Item -Path "public" -Destination ".next\standalone\public" -Recurse -Force
    
    - name: Build Electron EXE
      shell: pwsh
      run: npx electron-builder --win nsis --x64 --config.npmRebuild=false --config.win.signAndEditExecutable=false --config.publish=null
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload EXE to GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $exe = Get-ChildItem "dist\BankResaneh-Setup-*.exe" | Select-Object -First 1
        Write-Host "Uploading: $($exe.Name) ($($exe.Length / 1MB) MB)"
        gh release upload v2.0.0 $exe.FullName --clobber
