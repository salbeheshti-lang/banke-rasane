name: Build Windows installer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bankresaneh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Test persistent Prisma SQLite runtime
        run: bun scripts/test-prisma-runtime.ts

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/electron-builder
            .ci-cache/electron
          key: windows-electron-builder-v3-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*', 'package-lock.json') }}
          restore-keys: |
            windows-electron-builder-v3-${{ runner.os }}-

      - name: Build and type-check installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== Electron build attempt $attempt/$maxAttempts ==="
            npm run electron:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = [Math]::Min(180, [int](10 * [Math]::Pow(2, $attempt - 1)))
              Write-Warning "Build failed (exit $LASTEXITCODE). Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          throw "Electron build failed after $maxAttempts attempts."
        env:
          DATABASE_URL: file:./db/custom.db
          DEBUG: electron-builder
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron

      # ============================================================
      # CRITICAL: Verify that the Next.js standalone server.js can
      # actually find 'next' in the packaged resources directory.
      # electron-builder copies .next/standalone → resources/next-service-dist
      # but this copy has been failing silently — node_modules was missing
      # in the packaged app, causing "Cannot find module 'next'" on startup.
      # ============================================================
      - name: Verify Next.js module in packaged app
        shell: pwsh
        run: |
          Write-Host "=== Checking packaged app structure ==="
          $packagedDir = "release\win-unpacked\resources\app"
          $nextServiceDist = "release\win-unpacked\resources\app\.next\standalone"

          # With asar:false, files are in resources/app/.next/standalone
          # With asar:true, files would be in app.asar — but we disabled asar.
          # Check both possible locations.
          $possiblePaths = @(
            "release\win-unpacked\resources\app\.next\standalone",
            "release\win-unpacked\resources\app\node_modules",
            "release\win-unpacked\resources\next-service-dist"
          )

          foreach ($p in $possiblePaths) {
            if (Test-Path $p) {
              Write-Host "  Found: $p"
            }
          }

          # The real check: does the packaged app have server.js
          # AND node_modules/next/package.json in the SAME directory?
          # IMPORTANT: order must match electron/main.js getNextServerPath() —
          # next-service-dist is checked FIRST by the app, so test it FIRST here too.
          # The standalone payload must exist only once. electron/main.js
          # launches the canonical extraResources copy under next-service-dist.
          $canonicalServerPath = "release\win-unpacked\resources\next-service-dist\server.js"
          $duplicateServerPath = "release\win-unpacked\resources\app\.next\standalone\server.js"

          if (-not (Test-Path $canonicalServerPath)) {
            throw "FATAL: Canonical Next.js server missing from resources\next-service-dist"
          }
          if (Test-Path $duplicateServerPath) {
            throw "FATAL: Duplicate Next.js standalone payload found under resources\app\.next\standalone"
          }

          $serverCandidates = @(
            $canonicalServerPath
          )

          $serverPath = $null
          foreach ($c in $serverCandidates) {
            if (Test-Path $c) { $serverPath = $c; break }
          }

          if (-not $serverPath) {
            Write-Host "  server.js not found in any expected location"
            Write-Host "  Listing release\win-unpacked\resources:"
            if (Test-Path "release\win-unpacked\resources") {
              Get-ChildItem "release\win-unpacked\resources" -Recurse -Depth 2 | Select-Object FullName
            }
            throw "FATAL: server.js not found in packaged app"
          }

          Write-Host "  server.js found at: $serverPath"
          $serverDir = Split-Path $serverPath -Parent
          $nextPkg = Join-Path $serverDir "node_modules\next\package.json"

          if (-not (Test-Path $nextPkg)) {
            throw "FATAL: next/package.json missing from installer payload; afterPack dereferenced copy did not run"
          }
          Write-Host "  ✓ next/package.json found in installer payload (no post-build repair)"

          $seedFile = Join-Path $serverDir "public\talk-shows-data.json"
          if (-not (Test-Path $seedFile)) {
            throw "FATAL: talk-shows-data.json missing from packaged standalone public directory"
          }
          $seedData = Get-Content $seedFile -Raw | ConvertFrom-Json
          if ($seedData.Count -lt 1) {
            throw "FATAL: packaged talk-shows-data.json is empty"
          }
          Write-Host "  ✓ Archive seed found in standalone payload ($($seedData.Count) records)"

          # ============================================================
          # Test: actually require('next') from the server directory
          # ============================================================
          Write-Host "=== Testing require('next') from server directory ==="
          $serverDir2 = Split-Path $serverPath -Parent
          $testScript = @"
          try {
            const nextPath = require.resolve('next', { paths: ['$($serverDir2 -replace '\\','/')'] });
            console.log('SUCCESS: next resolved to: ' + nextPath);
            process.exit(0);
          } catch (e) {
            console.log('FAIL: ' + e.message);
            process.exit(1);
          }
          "@
          $testScript | Out-File -FilePath "test-require.cjs" -Encoding utf8
          node test-require.cjs
          if ($LASTEXITCODE -ne 0) {
            throw "FATAL: require('next') failed in packaged app directory"
          }

          # ============================================================
          # Test: start the Next.js server EXACTLY like Electron does —
          # using the packaged Electron binary with ELECTRON_RUN_AS_NODE=1,
          # not plain `node`. This catches issues that only appear in the
          # real runtime (e.g. Electron's Node version, native modules, etc.)
          # ============================================================
          Write-Host "=== Testing Next.js server startup (Electron simulation) ==="
          $testPort = "3457"
          $testHost = "127.0.0.1"

          # Find the packaged Electron binary (the .exe that users will run)
          $electronExe = Get-ChildItem "release\win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -notmatch 'setup|uninstall' } | Select-Object -First 1
          if (-not $electronExe) {
            throw "FATAL: Cannot find the packaged Electron .exe in release\win-unpacked"
          }
          Write-Host "  Using Electron binary: $($electronExe.FullName)"

          # Convert serverPath to ABSOLUTE path — relative paths fail with
          # ELECTRON_RUN_AS_NODE because Electron resolves paths differently.
          $absServerPath = (Resolve-Path $serverPath).Path
          $absServerDir = (Resolve-Path $serverDir).Path
          Write-Host "  Server path (absolute): $absServerPath"
          Write-Host "  Server dir (absolute): $absServerDir"

          # Set env vars EXACTLY like electron/main.js does:
          #   ELECTRON_RUN_AS_NODE=1 — makes Electron act as plain Node
          #   PORT/HOSTNAME — tells Next.js where to listen
          #   NODE_ENV=production
          #   BANKRESANEH_STARTUP_TOKEN — required by /api/internal/ready
          $testEnv = @{
            "ELECTRON_RUN_AS_NODE" = "1";
            "PORT" = $testPort;
            "HOSTNAME" = $testHost;
            "NODE_ENV" = "production";
          }

          # Merge with current process env
          foreach ($k in $testEnv.Keys) { Set-Item -Path "Env:$k" -Value $testEnv[$k] }

          # Start the Electron binary as a Node process.
          # Use absolute paths and capture stderr to a log file.
          $stderrFile = Join-Path $env:RUNNER_TEMP "electron-stderr.log"
          $stdoutFile = Join-Path $env:RUNNER_TEMP "electron-stdout.log"

          $proc = Start-Process -FilePath $electronExe.FullName `
            -ArgumentList $absServerPath `
            -PassThru -WindowStyle Hidden `
            -WorkingDirectory $absServerDir `
            -RedirectStandardError $stderrFile `
            -RedirectStandardOutput $stdoutFile

          $serverReady = $false
          $maxAttempts = 20
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              Write-Host "  ✗ Server process exited early (code: $($proc.ExitCode))"
              # Print stderr and stdout so we can see what went wrong
              if (Test-Path $stderrFile) {
                Write-Host "  --- STDERR ---"
                Get-Content $stderrFile | ForEach-Object { Write-Host "    $_" }
              }
              if (Test-Path $stdoutFile) {
                Write-Host "  --- STDOUT ---"
                Get-Content $stdoutFile | ForEach-Object { Write-Host "    $_" }
              }
              throw "FATAL: Next.js server crashed during startup (exit code $($proc.ExitCode))"
            }
            try {
              $response = Invoke-WebRequest -Uri "http://$testHost`:$testPort/" -TimeoutSec 3 -UseBasicParsing
              # STRICT: only HTTP 200 is success. Redirects, 4xx, 5xx all fail.
              if ($response.StatusCode -eq 200) {
                Write-Host "  ✓ Server returned HTTP 200 (attempt $i)"
                $serverReady = $true
                break
              } else {
                Write-Host "  Attempt ${i}: got HTTP $($response.StatusCode) — not 200, retrying..."
              }
            } catch {
              # Invoke-WebRequest throws on 4xx/5xx — extract the status code
              $statusCode = $_.Exception.Response.StatusCode.value__
              if ($statusCode) {
                Write-Host "  Attempt ${i}: got HTTP $statusCode — not 200, retrying..."
              } else {
                Write-Host "  Attempt ${i}: no response yet (waiting...)"
              }
            }
          }

          if (-not $serverReady) {
            if (-not $proc.HasExited) { $proc.Kill() }
            Write-Host "  ✗ FATAL: Server did not return HTTP 200 after $maxAttempts attempts"
            throw "FATAL: Next.js server did not produce HTTP 200 — build cannot be released"
          }

          if (-not $proc.HasExited) { $proc.Kill() }
          # Clean up env
          foreach ($k in $testEnv.Keys) { Remove-Item -Path "Env:$k" -ErrorAction SilentlyContinue }

          Write-Host "=== All checks passed ==="

      - name: Verify installer and update manifest consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No Setup.exe was produced.' }
          $canonicalName = 'BankResaneh-Setup.exe'
          $canonicalPath = Join-Path 'release' $canonicalName
          if ($setup.Name -ne $canonicalName) {
            Copy-Item $setup.FullName $canonicalPath -Force
            Remove-Item $setup.FullName -Force
          }
          $manifestPath = 'release/latest.yml'
          if (-not (Test-Path $manifestPath)) { throw 'electron-builder did not produce latest.yml for auto-update.' }
          $manifest = Get-Content $manifestPath -Raw
          if ($manifest -notmatch [regex]::Escape("url: $canonicalName") -or $manifest -notmatch [regex]::Escape("path: $canonicalName")) {
            throw "latest.yml does not reference the published installer name $canonicalName. Refusing to publish a broken updater manifest."
          }
          if (-not (Test-Path $canonicalPath)) { throw 'Canonical installer file is missing.' }
          Write-Host "✓ Installer and latest.yml both reference $canonicalName"
          Get-ChildItem release

      # ============================================================
      # INSTALLER SMOKE TEST — exercise the actual NSIS Setup.exe.
      # This catches extraction/install hangs that win-unpacked tests
      # cannot detect. Silent mode still runs the NSIS install sections.
      # ============================================================
      - name: Install 5.3.9, upgrade in place to 5.4.0, and verify data preservation
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'BankResaneh-Installer-Smoke'
          $oldSetup = Join-Path $env:RUNNER_TEMP 'BankResaneh-5.3.9-Setup.exe'
          $newSetup = (Resolve-Path 'release/BankResaneh-Setup.exe').Path
          $oldUrl = 'https://github.com/salbeheshti-lang/banke-rasane/releases/download/v5.3.9/BankResaneh-Setup.exe'
          Invoke-WebRequest -Uri $oldUrl -OutFile $oldSetup
          if ((Get-Item $oldSetup).Length -lt 100MB) { throw 'Downloaded 5.3.9 installer is unexpectedly small.' }

          function Invoke-Installer([string]$Path, [string]$LogPath) {
            $p = Start-Process -FilePath $Path -ArgumentList @('/S', "/LOG=$LogPath", "/D=$installDir") -PassThru
            if (-not $p.WaitForExit(600000)) { try { & taskkill.exe /PID $p.Id /T /F | Out-Null } catch {}; throw "Installer timed out: $Path" }
            if ($p.ExitCode -ne 0) { if (Test-Path $LogPath) { Get-Content $LogPath -Tail 120 }; throw "Installer failed with exit code $($p.ExitCode): $Path" }
          }

          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          Write-Host '=== Installing the published 5.3.9 baseline ==='
          Invoke-Installer $oldSetup (Join-Path $env:RUNNER_TEMP 'install-5.3.9.log')
          $installedExe = Join-Path $installDir 'BankResaneh.exe'
          if (-not (Test-Path $installedExe)) { throw '5.3.9 executable missing after baseline install.' }
          node scripts/smoke-electron.cjs "$installedExe"
          if ($LASTEXITCODE -ne 0) { throw '5.3.9 baseline application did not pass startup/API/database smoke test.' }

          $userData = Join-Path $env:APPDATA 'banke-rasane'
          $dbPath = Join-Path $userData 'db\\bankresaneh.sqlite'
          if (-not (Test-Path $dbPath)) { throw "5.3.9 did not create its persistent SQLite database: $dbPath" }
          $before = @{}
          Get-ChildItem $userData -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($userData.Length).TrimStart('\\')
            $before[$relative] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }
          Set-Content -LiteralPath (Join-Path $userData 'upgrade-preservation-sentinel.txt') -Value 'created-under-5.3.9' -NoNewline
          $before['upgrade-preservation-sentinel.txt'] = (Get-FileHash (Join-Path $userData 'upgrade-preservation-sentinel.txt') -Algorithm SHA256).Hash

          Write-Host '=== Upgrading the existing 5.3.9 installation in place to the current 5.4.0 build ==='
          Invoke-Installer $newSetup (Join-Path $env:RUNNER_TEMP 'upgrade-to-5.4.0.log')
          foreach ($relative in $before.Keys) {
            $file = Join-Path $userData $relative
            if (-not (Test-Path $file -PathType Leaf)) { throw "5.4.0 installer deleted 5.3.9 user-data file: $relative" }
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $before[$relative]) { throw "5.4.0 installer modified 5.3.9 user-data file: $relative" }
          }
          Write-Host "PASS: 5.3.9 -> 5.4.0 preserved $($before.Count) user-data files byte-for-byte, including the SQLite database."

          foreach ($required in @($installedExe, (Join-Path $installDir 'resources\\next-service-dist\\server.js'), (Join-Path $installDir 'resources\\api-service\\index.js'), (Join-Path $installDir 'resources\\bun-runtime\\bin\\bun.exe'))) {
            if (-not (Test-Path $required)) { throw "5.4.0 installed file missing: $required" }
          }
          node scripts/smoke-electron.cjs "$installedExe"
          if ($LASTEXITCODE -ne 0) { throw '5.4.0 application failed to start after in-place upgrade.' }
          Write-Host 'PASS: actual published 5.3.9 NSIS installation upgraded in place to 5.4.0; persistent DB and files survived; upgraded app starts.'

      # ============================================================
      # FULL SMOKE TEST — run the actual BankResaneh.exe and verify:
      # - Next.js UI responds (port 3000)
      # - Local API responds (port 3002)
      # - Database is seeded (showsCount > 0)
      # - Search endpoint is protected (401 without auth)
      # This is the REAL test — not just "can Node require('next')".
      # ============================================================
      - name: Full smoke test (Electron + API + DB)
        shell: pwsh
        run: |
          Write-Host "=== Running full smoke test ==="
          Write-Host "Starting BankResaneh.exe and waiting for Next.js + API + DB..."

          # The smoke test script does everything:
          # 1. Spawns release/win-unpacked/BankResaneh.exe
          # 2. Waits for Next.js UI on port 3000
          # 3. Waits for API on port 3002/api/health
          # 4. Checks showsCount > 0 (database seeded)
          # 5. Probes /api/shows/search for 401 (auth enforced)
          # 6. Kills the process
          node scripts/smoke-electron.cjs
          if ($LASTEXITCODE -ne 0) {
            throw "FATAL: Smoke test failed — the packaged app does not work correctly"
          }
          Write-Host "=== Smoke test passed ==="

      - name: Verify in-place installer upgrade preserves user data
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'BankResaneh-Installer-Smoke'
          $setup = (Resolve-Path 'release/BankResaneh-Setup.exe').Path
          $userData = Join-Path $env:APPDATA 'banke-rasane'
          if (-not (Test-Path $userData)) { throw "Expected user data directory was not created by installed-app smoke test: $userData" }

          # Snapshot every persistent file after the first real app launch.
          $before = @{}
          Get-ChildItem $userData -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($userData.Length).TrimStart('\\')
            $before[$relative] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }
          if (-not $before.ContainsKey('db\bankresaneh.sqlite')) {
            throw 'The real user database was not created; cannot claim upgrade preservation was tested.'
          }
          Set-Content -LiteralPath (Join-Path $userData 'upgrade-preservation-sentinel.txt') -Value '5.3.9-to-5.4.0-upgrade-preservation' -NoNewline
          $before['upgrade-preservation-sentinel.txt'] = (Get-FileHash (Join-Path $userData 'upgrade-preservation-sentinel.txt') -Algorithm SHA256).Hash

          Write-Host "Re-running the actual NSIS installer over the existing installation: $installDir"
          $log = Join-Path $env:RUNNER_TEMP 'bankresaneh-upgrade-installer.log'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/S', "/LOG=$log", "/D=$installDir") -PassThru
          if (-not $proc.WaitForExit(600000)) { try { & taskkill.exe /PID $proc.Id /T /F | Out-Null } catch {}; throw 'In-place installer upgrade timed out.' }
          if ($proc.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log -Tail 100 }; throw "In-place installer upgrade failed: $($proc.ExitCode)" }

          foreach ($relative in $before.Keys) {
            $file = Join-Path $userData $relative
            if (-not (Test-Path $file -PathType Leaf)) { throw "Upgrade deleted persistent user-data file: $relative" }
            $afterHash = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($afterHash -ne $before[$relative]) { throw "Upgrade modified persistent user-data file: $relative" }
          }
          Write-Host "PASS: in-place NSIS upgrade preserved $($before.Count) user-data files byte-for-byte, including SQLite database and sentinel."

          $installedExe = Join-Path $installDir 'BankResaneh.exe'
          node scripts/smoke-electron.cjs "$installedExe"
          if ($LASTEXITCODE -ne 0) { throw 'Application failed to start after in-place installer upgrade.' }
          Write-Host 'PASS: installed application starts after in-place upgrade.'

      # ============================================================
      # INSTALLER SMOKE TEST — install the actual NSIS Setup.exe
      # and run the installed app. This catches extraction/install
      # hangs that win-unpacked tests cannot detect.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankResaneh-Windows-Setup
          path: |
            release/BankResaneh-Setup.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 90

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BankResaneh-Setup.exe
            release/latest.yml
            release/*.blockmap
          name: بانک رسانه ${{ github.ref_name }}
          body: |
            # بانک رسانه ${{ github.ref_name }}

            ## نصب
            ۱. فایل BankResaneh-Setup.exe را دانلود کنید.
            ۲. روی آن دابل‌کلیک کنید و مراحل نصب را دنبال کنید.
          draft: false
          prerelease: false
