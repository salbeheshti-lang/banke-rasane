name: Build Windows .exe

# Builds the بانک رسانه Windows installer (.exe) on a GitHub-hosted
# Windows runner and uploads it as a release asset.
#
# Triggers:
#   - Push of a tag like v1.0.0  → builds + creates/updates a GitHub Release
#   - Manual dispatch via Actions tab → builds + uploads as workflow artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          bun install
          cd mini-services/api-service && bun install && cd ../..

      - name: Build Next.js (standalone)
        shell: bash
        run: bun run build

      - name: Build Electron installer (.exe)
        shell: bash
        env:
          # electron-builder uses GH_TOKEN to publish to GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run electron:dist

      - name: Verify installer exists
        shell: bash
        run: |
          ls -la release/
          if ! ls release/*-Setup.exe 2>/dev/null; then
            echo "ERROR: No -Setup.exe found in release/"
            exit 1
          fi

      - name: Rename installer to friendly name
        shell: bash
        run: |
          mv release/*-Setup.exe release/BankResaneh-Setup.exe 2>/dev/null
          ls -la release/

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: BankResaneh-Windows-Setup
          path: release/BankResaneh-Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BankResaneh-Setup.exe
          name: بانک رسانه ${{ github.ref_name }}
          body: |
            # بانک رسانه ${{ github.ref_name }}

            ## دانلود و نصب

            ۱. فایل `BankResaneh-Setup.exe` را دانلود کنید.
            ۲. روی آن دابل‌کلیک کنید و مراحل نصب را دنبال کنید.
            ۳. پس از نصب، برنامه از منوی Start با نام **بانک رسانه** در دسترس است.

            ## ورود

            - نام کاربری: `admin`
            - رمز عبور: `admin`

            پس از اولین ورود، از تنظیمات رمز خود را تغییر دهید.

            ## پیش‌نیازها

            - ویندوز ۱۰ یا بالاتر (64-bit)
            - اتصال اینترنت برای اولین اجرا (جهت بارگذاری منابع)
          draft: false
          prerelease: false
