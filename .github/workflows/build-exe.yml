name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Build and type-check installer
        run: npm run electron:build

      - name: Verify and rename installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No Setup.exe was produced.' }
          Copy-Item $setup.FullName 'release/BankResaneh-Setup.exe' -Force
          if (-not (Test-Path 'release/latest.yml')) { throw 'electron-builder did not produce latest.yml for auto-update.' }
          Get-ChildItem release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankResaneh-Windows-Setup
          path: |
            release/BankResaneh-Setup.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 90

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BankResaneh-Setup.exe
            release/latest.yml
            release/*.blockmap
          name: بانک رسانه ${{ github.ref_name }}
          body: |
            # بانک رسانه ${{ github.ref_name }}

            ## نصب
            ۱. فایل BankResaneh-Setup.exe را دانلود کنید.
            ۲. روی آن دابل‌کلیک کنید و مراحل نصب را دنبال کنید.
          draft: false
          prerelease: false
