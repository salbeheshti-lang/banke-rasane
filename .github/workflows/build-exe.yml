name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build Next.js
      run: npx next build
    
    - name: Copy static files
      shell: pwsh
      run: |
        Copy-Item -Path ".next\static" -Destination ".next\standalone\.next\static" -Recurse -Force
        Copy-Item -Path "public" -Destination ".next\standalone\public" -Recurse -Force
    
    - name: Build Electron EXE (skip native rebuild)
      shell: pwsh
      run: npx electron-builder --win nsis --x64 --config.npmRebuild=false --config.win.signAndEditExecutable=false
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload EXE to release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/BankResaneh-Setup-*.exe
        tag_name: v2.0.0
        name: "BankResaneh v2.0.0"
        body: "بانک رسانه — آرشیو تخصصی برنامه‌های تلویزیونی"
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
