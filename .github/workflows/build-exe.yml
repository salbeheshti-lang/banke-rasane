name: Build Windows .exe
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (npm)
        run: npm install
      - name: Install API service dependencies (npm)
        run: cd mini-services/api-service && npm install && cd ../..
      - name: Download Bun binary for Windows
        shell: powershell
        run: |
          $url = "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          $output = "bun.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath bun-temp -Force
          New-Item -ItemType Directory -Force -Path electron/bun
          Copy-Item bun-temp\bun-windows-x64\bun.exe electron/bun\bun.exe
          Remove-Item -Recurse -Force bun-temp
          Remove-Item bun.zip
          Write-Host "Bun binary downloaded to electron/bun/bun.exe"
      - name: Build Next.js
        run: npx next build && node scripts/copy-standalone.cjs
      - name: Build Electron installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never
      - name: Verify and rename installer
        shell: bash
        run: |
          ls -la release/
          SETUP=$(find release -maxdepth 1 -name "*Setup*.exe" -type f | head -1)
          if [ -z "$SETUP" ]; then echo "No Setup.exe found"; exit 1; fi
          cp "$SETUP" release/BankResaneh-Setup.exe
          ls -la release/BankResaneh-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BankResaneh-Windows-Setup
          path: release/BankResaneh-Setup.exe
          if-no-files-found: error
          retention-days: 90
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BankResaneh-Setup.exe
          name: بانک رسانه ${{ github.ref_name }}
          body: |
            # بانک رسانه ${{ github.ref_name }}

            ## نصب
            ۱. فایل BankResaneh-Setup.exe را دانلود کنید.
            ۲. روی آن دابل‌کلیک کنید و مراحل نصب را دنبال کنید.
            ۳. ورود: admin / admin
          draft: false
          prerelease: false
