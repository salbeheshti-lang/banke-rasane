name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Build and type-check installer
        run: npm run electron:build

      # ============================================================
      # CRITICAL: Verify that the Next.js standalone server.js can
      # actually find 'next' in the packaged resources directory.
      # electron-builder copies .next/standalone → resources/next-service-dist
      # but this copy has been failing silently — node_modules was missing
      # in the packaged app, causing "Cannot find module 'next'" on startup.
      # ============================================================
      - name: Verify Next.js module in packaged app
        shell: pwsh
        run: |
          Write-Host "=== Checking packaged app structure ==="
          $packagedDir = "release\win-unpacked\resources\app"
          $nextServiceDist = "release\win-unpacked\resources\app\.next\standalone"

          # With asar:false, files are in resources/app/.next/standalone
          # With asar:true, files would be in app.asar — but we disabled asar.
          # Check both possible locations.
          $possiblePaths = @(
            "release\win-unpacked\resources\app\.next\standalone",
            "release\win-unpacked\resources\app\node_modules",
            "release\win-unpacked\resources\next-service-dist"
          )

          foreach ($p in $possiblePaths) {
            if (Test-Path $p) {
              Write-Host "  Found: $p"
            }
          }

          # The real check: does the packaged app have next-service-dist/server.js
          # AND node_modules/next/package.json in the SAME directory?
          $serverCandidates = @(
            "release\win-unpacked\resources\app\.next\standalone\server.js",
            "release\win-unpacked\resources\next-service-dist\server.js"
          )

          $serverPath = $null
          foreach ($c in $serverCandidates) {
            if (Test-Path $c) { $serverPath = $c; break }
          }

          if (-not $serverPath) {
            Write-Host "  server.js not found in any expected location"
            Write-Host "  Listing release\win-unpacked\resources:"
            if (Test-Path "release\win-unpacked\resources") {
              Get-ChildItem "release\win-unpacked\resources" -Recurse -Depth 2 | Select-Object FullName
            }
            throw "FATAL: server.js not found in packaged app"
          }

          Write-Host "  server.js found at: $serverPath"
          $serverDir = Split-Path $serverPath -Parent
          $nextPkg = Join-Path $serverDir "node_modules\next\package.json"

          if (Test-Path $nextPkg) {
            Write-Host "  ✓ next/package.json found in packaged app"
          } else {
            Write-Host "  ✗ next/package.json MISSING in packaged app"
            Write-Host "  Attempting to copy node_modules from standalone output..."

            # Copy the ENTIRE node_modules from .next/standalone to the server dir
            $srcNodeModules = ".next\standalone\node_modules"
            $destNodeModules = Join-Path $serverDir "node_modules"

            if (Test-Path $srcNodeModules) {
              Write-Host "  Copying $srcNodeModules → $destNodeModules"
              Copy-Item -Recurse -Force $srcNodeModules $destNodeModules

              # Verify
              if (Test-Path $nextPkg) {
                Write-Host "  ✓ next/package.json now present after manual copy"
              } else {
                Write-Host "  ✗ FATAL: next still missing after manual copy"
                throw "FATAL: Cannot find module 'next' in packaged app even after manual copy"
              }
            } else {
              Write-Host "  ✗ FATAL: .next/standalone/node_modules does not exist either"
              throw "FATAL: Build output is missing node_modules entirely"
            }
          }

          # ============================================================
          # Test: actually require('next') from the server directory
          # ============================================================
          Write-Host "=== Testing require('next') from server directory ==="
          $serverDir2 = Split-Path $serverPath -Parent
          $testScript = @"
          try {
            const nextPath = require.resolve('next', { paths: ['$($serverDir2 -replace '\\','/')'] });
            console.log('SUCCESS: next resolved to: ' + nextPath);
            process.exit(0);
          } catch (e) {
            console.log('FAIL: ' + e.message);
            process.exit(1);
          }
          "@
          $testScript | Out-File -FilePath "test-require.cjs" -Encoding utf8
          node test-require.cjs
          if ($LASTEXITCODE -ne 0) {
            throw "FATAL: require('next') failed in packaged app directory"
          }

          # ============================================================
          # Test: start the Next.js server EXACTLY like Electron does —
          # using the packaged Electron binary with ELECTRON_RUN_AS_NODE=1,
          # not plain `node`. This catches issues that only appear in the
          # real runtime (e.g. Electron's Node version, native modules, etc.)
          # ============================================================
          Write-Host "=== Testing Next.js server startup (Electron simulation) ==="
          $testPort = "3457"
          $testHost = "127.0.0.1"

          # Find the packaged Electron binary (the .exe that users will run)
          $electronExe = Get-ChildItem "release\win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -notmatch 'setup|uninstall' } | Select-Object -First 1
          if (-not $electronExe) {
            throw "FATAL: Cannot find the packaged Electron .exe in release\win-unpacked"
          }
          Write-Host "  Using Electron binary: $($electronExe.FullName)"

          # Convert serverPath to ABSOLUTE path — relative paths fail with
          # ELECTRON_RUN_AS_NODE because Electron resolves paths differently.
          $absServerPath = (Resolve-Path $serverPath).Path
          $absServerDir = (Resolve-Path $serverDir).Path
          Write-Host "  Server path (absolute): $absServerPath"
          Write-Host "  Server dir (absolute): $absServerDir"

          # Set env vars EXACTLY like electron/main.js does:
          #   ELECTRON_RUN_AS_NODE=1 — makes Electron act as plain Node
          #   PORT/HOSTNAME — tells Next.js where to listen
          #   NODE_ENV=production
          #   BANKRESANEH_STARTUP_TOKEN — required by /api/internal/ready
          $testEnv = @{
            "ELECTRON_RUN_AS_NODE" = "1";
            "PORT" = $testPort;
            "HOSTNAME" = $testHost;
            "NODE_ENV" = "production";
          }

          # Merge with current process env
          foreach ($k in $testEnv.Keys) { Set-Item -Path "Env:$k" -Value $testEnv[$k] }

          # Start the Electron binary as a Node process.
          # Use absolute paths and capture stderr to a log file.
          $stderrFile = Join-Path $env:RUNNER_TEMP "electron-stderr.log"
          $stdoutFile = Join-Path $env:RUNNER_TEMP "electron-stdout.log"

          $proc = Start-Process -FilePath $electronExe.FullName `
            -ArgumentList $absServerPath `
            -PassThru -WindowStyle Hidden `
            -WorkingDirectory $absServerDir `
            -RedirectStandardError $stderrFile `
            -RedirectStandardOutput $stdoutFile

          $serverReady = $false
          $maxAttempts = 20
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              Write-Host "  ✗ Server process exited early (code: $($proc.ExitCode))"
              # Print stderr and stdout so we can see what went wrong
              if (Test-Path $stderrFile) {
                Write-Host "  --- STDERR ---"
                Get-Content $stderrFile | ForEach-Object { Write-Host "    $_" }
              }
              if (Test-Path $stdoutFile) {
                Write-Host "  --- STDOUT ---"
                Get-Content $stdoutFile | ForEach-Object { Write-Host "    $_" }
              }
              throw "FATAL: Next.js server crashed during startup (exit code $($proc.ExitCode))"
            }
            try {
              $response = Invoke-WebRequest -Uri "http://$testHost`:$testPort/" -TimeoutSec 3 -UseBasicParsing
              # STRICT: only HTTP 200 is success. Redirects, 4xx, 5xx all fail.
              if ($response.StatusCode -eq 200) {
                Write-Host "  ✓ Server returned HTTP 200 (attempt $i)"
                $serverReady = $true
                break
              } else {
                Write-Host "  Attempt ${i}: got HTTP $($response.StatusCode) — not 200, retrying..."
              }
            } catch {
              # Invoke-WebRequest throws on 4xx/5xx — extract the status code
              $statusCode = $_.Exception.Response.StatusCode.value__
              if ($statusCode) {
                Write-Host "  Attempt ${i}: got HTTP $statusCode — not 200, retrying..."
              } else {
                Write-Host "  Attempt ${i}: no response yet (waiting...)"
              }
            }
          }

          if (-not $serverReady) {
            if (-not $proc.HasExited) { $proc.Kill() }
            Write-Host "  ✗ FATAL: Server did not return HTTP 200 after $maxAttempts attempts"
            throw "FATAL: Next.js server did not produce HTTP 200 — build cannot be released"
          }

          if (-not $proc.HasExited) { $proc.Kill() }
          # Clean up env
          foreach ($k in $testEnv.Keys) { Remove-Item -Path "Env:$k" -ErrorAction SilentlyContinue }

          Write-Host "=== All checks passed ==="

      - name: Verify and rename installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No Setup.exe was produced.' }
          Copy-Item $setup.FullName 'release/BankResaneh-Setup.exe' -Force
          if (-not (Test-Path 'release/latest.yml')) { throw 'electron-builder did not produce latest.yml for auto-update.' }
          Get-ChildItem release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankResaneh-Windows-Setup
          path: |
            release/BankResaneh-Setup.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 90

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BankResaneh-Setup.exe
            release/latest.yml
            release/*.blockmap
          name: بانک رسانه ${{ github.ref_name }}
          body: |
            # بانک رسانه ${{ github.ref_name }}

            ## نصب
            ۱. فایل BankResaneh-Setup.exe را دانلود کنید.
            ۲. روی آن دابل‌کلیک کنید و مراحل نصب را دنبال کنید.
          draft: false
          prerelease: false
