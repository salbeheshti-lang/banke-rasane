name: Build Android APK

# Builds the بانک رسانه Android APK on a GitHub-hosted Ubuntu runner
# using Capacitor (wraps the static Next.js export in a native WebView).
#
# Triggers:
#   - Push of a tag like v1.0.0  → builds + attaches APK to the same Release
#   - Manual dispatch via Actions tab → builds + uploads as workflow artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed by softprops/action-gh-release to create releases
      actions: write    # needed to upload workflow artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install dependencies
        run: |
          bun install
          cd mini-services/api-service && bun install && cd ../..

      - name: Install Capacitor
        run: |
          bun add -D @capacitor/core @capacitor/cli @capacitor/android
          bunx cap init "بانک رسانه" "com.banke.rasane" --web-dir=out

      - name: Configure Next.js for static export
        run: |
          # Temporarily switch output to 'export' so we get a fully static bundle
          # The / route is the only page, so export works cleanly.
          node -e "
            const fs = require('fs');
            const p = 'next.config.ts';
            let s = fs.readFileSync(p, 'utf8');
            if (!s.includes(\"output: \\\"export\\\"\")) {
              s = s.replace('output: \"standalone\"', 'output: \"export\"');
              s = s.replace(/experimental:[^}]*},?/m, '');
              fs.writeFileSync(p, s);
            }
          "
          cat next.config.ts

      - name: Remove Next.js API routes (not compatible with static export)
        run: |
          # The Bun API service (port 3002) handles all /api/* requests at runtime,
          # so the Next.js API routes are unused in the static export.
          rm -rf src/app/api
          echo "Removed src/app/api (replaced by bundled Bun API service)"

      - name: Build Next.js (static export)
        run: bun run next build || npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Verify export output
        run: ls -la out/

      - name: Add Android platform
        run: |
          bunx cap add android
          bunx cap copy android

      - name: Generate app icon
        run: |
          # Replace the Capacitor default icon with our brand icon.
          # Capacitor's template ships adaptive-icon XML files in mipmap-anydpi-v26
          # (referencing @mipmap/ic_launcher), so we only overwrite the PNG files
          # named ic_launcher.png — leaving the XML descriptors untouched.
          ICON=public/banke-rasane-logo.png
          if [ -f "$ICON" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              [ -d "$d" ] || continue
              # Skip the anydpi-v26 folder (XML adaptive icon descriptors)
              case "$d" in *anydpi*) continue;; esac
              cp "$ICON" "$d/ic_launcher.png" 2>/dev/null || true
              cp "$ICON" "$d/ic_launcher_round.png" 2>/dev/null || true
            done
            echo "Replaced launcher icons"
          fi

      - name: Build APK (debug, signed with debug key for simplicity)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lintVitalAnalyzeRelease

      - name: Verify APK exists
        run: |
          find android -name "*.apk" -type f
          APK=$(find android -name "*-debug.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK built"; exit 1; fi
          cp "$APK" BankResaneh.apk
          ls -la BankResaneh.apk

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: BankResaneh-Android-APK
          path: BankResaneh.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BankResaneh.apk
          name: بانک رسانه ${{ github.ref_name }}
          body: |
            # بانک رسانه ${{ github.ref_name }}

            ## نصب APK

            ۱. فایل `BankResaneh.apk` را دانلود کنید.
            ۲. در تنظیمات اندروید، "نصب از منابع ناشناخته" را فعال کنید.
            ۳. روی فایل APK ضربه بزنید تا نصب شود.
            ۴. آیکون **بانک رسانه** در منوی برنامه‌ها ظاهر می‌شود.

            ## ورود

            - نام کاربری: `admin`
            - رمز عبور: `admin`

            ## نکته

            این APK نسخهٔ وب برنامه را در یک WebView بومی اندروید اجرا می‌کند.
            برای دسترسی به داده‌ها، برنامه به یک سرویس API روی همان دستگاه
            نیاز دارد؛ برای استفادهٔ آفلاین کامل، نسخهٔ ویندوز را نصب کنید.
          draft: false
          prerelease: false
