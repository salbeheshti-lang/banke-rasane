name: Read-only Cloudflare D1 audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-test-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          raw=$(curl --silent --show-error -w '\\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          code=$(printf '%s\\n' "$raw" | tail -n 1)
          body=$(printf '%s\\n' "$raw" | sed '$d')
          if [[ "$code" != "200" ]] || [[ "$(echo "$body" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::Cloudflare token verification failed (HTTP $code)."
            exit 1
          fi
          echo "Cloudflare token verified; secret value was not printed."

      - name: Locate isolated test database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          raw=$(curl --silent --show-error -w '\\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          code=$(printf '%s\\n' "$raw" | tail -n 1)
          body=$(printf '%s\\n' "$raw" | sed '$d')
          if [[ "$code" != "200" ]] || [[ "$(echo "$body" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::Cannot list D1 databases in the configured account (HTTP $code). Check Account > D1 > Read."
            echo "$body" | jq -r '.errors[]?.message' || true
            exit 1
          fi
          database_id=$(echo "$body" | jq -r '.result[]? | select(.name == "bankresaneh-test") | .uuid' | head -n 1)
          if [[ -z "$database_id" || "$database_id" == "null" ]]; then
            echo "::error::bankresaneh-test was not found in the configured Cloudflare account."
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "Confirmed isolated target: bankresaneh-test"

      - name: Read schema and table names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          payload=$(jq -nc --arg sql "SELECT name, sql FROM sqlite_master WHERE type = 'table' ORDER BY name;" '{sql: $sql}')
          raw=$(curl --silent --show-error -w '\\n%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$payload" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          code=$(printf '%s\\n' "$raw" | tail -n 1)
          body=$(printf '%s\\n' "$raw" | sed '$d')
          if [[ "$code" != "200" ]] || [[ "$(echo "$body" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::Read-only D1 schema query failed (HTTP $code)."
            echo "$body" | jq -r '.errors[]?.message' || true
            exit 1
          fi
          echo "$body" | jq -r '.result[].results[]? | [.name, .sql] | @tsv'

      - name: Read aggregate counts for known application tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          for table in shows users sessions; do
            payload=$(jq -nc --arg sql "SELECT COUNT(*) AS row_count FROM \\"$table\\";" '{sql: $sql}')
            raw=$(curl --silent --show-error -w '\\n%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$payload" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
            code=$(printf '%s\\n' "$raw" | tail -n 1)
            body=$(printf '%s\\n' "$raw" | sed '$d')
            if [[ "$code" != "200" ]] || [[ "$(echo "$body" | jq -r '.success // false')" != "true" ]]; then
              echo "Table $table: not present or not queryable (HTTP $code)."
            else
              echo "$table: $(echo "$body" | jq -r '.result[0].results[0].row_count // "0"')"
            fi
          done

      - name: Record read-only safety boundary
        if: always()
        run: |
          {
            echo "## D1 audit scope"
            echo "- Manual read-only audit of bankresaneh-test only."
            echo "- Only schema metadata and aggregate counts were queried."
            echo "- No personal data or show content was read."
            echo "- No writes, migrations, deletes, or deployments were performed."
          } >> "$GITHUB_STEP_SUMMARY"
