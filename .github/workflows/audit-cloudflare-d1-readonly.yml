name: Read-only Cloudflare D1 audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-live-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve configured D1 database
        id: d1-config
        run: |
          configured_database=$(sed -n 's/^[[:space:]]*database_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' worker/wrangler.toml | head -n 1)
          configured_account=$(sed -n 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' worker/wrangler.toml | head -n 1)
          if [[ ! "$configured_database" =~ ^[0-9a-f-]{36}$ || ! "$configured_account" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::D1 database/account ID is missing or invalid in worker/wrangler.toml."
            exit 1
          fi
          echo "account_id=$configured_account" >> "$GITHUB_OUTPUT"
          echo "database_id=$configured_database" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare token and read-only D1 access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ACCOUNT_ID: ${{ steps.d1-config.outputs.account_id }}
          D1_DATABASE_ID: ${{ steps.d1-config.outputs.database_id }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          verify=$(curl --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [[ "$(echo "$verify" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::Cloudflare token verification failed."
            echo "$verify" | jq -r '.errors[]?.message' || true
            exit 1
          fi
          raw=$(curl --silent --show-error -w '\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$D1_ACCOUNT_ID/d1/database")
          code=$(printf '%s\n' "$raw" | tail -n 1)
          body=$(printf '%s\n' "$raw" | sed '$d')
          if [[ "$code" != "200" ]] || [[ "$(echo "$body" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::Cannot list D1 databases in configured account $D1_ACCOUNT_ID (HTTP $code). Check Account > D1 > Read for this account."
            echo "$body" | jq -r '.errors[]?.message' || true
            exit 1
          fi
          if ! echo "$body" | jq -e --arg id "$D1_DATABASE_ID" '.result[]? | select(.uuid == $id)' >/dev/null; then
            echo "::error::Configured D1 database $D1_DATABASE_ID was not found in account $D1_ACCOUNT_ID."
            exit 1
          fi
          query=$(jq -nc '{sql:"SELECT name, sql FROM sqlite_master WHERE type = \"table\" ORDER BY name;"}')
          raw=$(curl --silent --show-error -w '\n%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$query" "https://api.cloudflare.com/client/v4/accounts/$D1_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          code=$(printf '%s\n' "$raw" | tail -n 1)
          body=$(printf '%s\n' "$raw" | sed '$d')
          if [[ "$code" != "200" ]] || [[ "$(echo "$body" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::D1 read-only schema query failed (HTTP $code)."
            echo "$body" | jq -r '.errors[]?.message' || true
            exit 1
          fi
          echo "$body" | jq -r '.result[].results[]? | [.name, .sql] | @tsv'
          echo "D1 schema audit completed with read-only SELECT access."

      - name: Record safety boundary
        if: always()
        run: |
          {
            echo "## D1 audit scope"
            echo "- Manual, read-only audit; not a pull-request merge gate."
            echo "- Schema metadata only; no user data or show content queried."
            echo "- No INSERT, UPDATE, DELETE, DROP, migration, deployment, or database mutation."
          } >> "$GITHUB_STEP_SUMMARY"
