name: Read-only Cloudflare D1 audit

on:
  push:
    branches:
      - preview/visual-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-live-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked project dependencies
        run: bun install --no-save

      - name: Verify Cloudflare credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          echo "Cloudflare credentials are present; secret values are not printed."

      - name: Locate the configured D1 database in the active Cloudflare account
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          echo "$response" | jq -r '.result[] | [.name, .uuid] | @tsv'
          database_id=$(echo "$response" | jq -r '.result[] | select(.name == "banke-rasane-db") | .uuid' | head -n 1)
          if [[ -z "$database_id" || "$database_id" == "null" ]]; then
            echo "::error::D1 database banke-rasane-db was not found in the configured Cloudflare account."
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Read D1 table names and schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          payload=$(jq -nc --arg sql "SELECT name, sql FROM sqlite_master WHERE type = 'table' ORDER BY name;" '{sql: $sql}')
          response=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          echo "$response" | jq -r '.result[].results[] | [.name, .sql] | @tsv'

      - name: Read aggregate row counts only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          for table in shows users sessions; do
            response=$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"sql\":\"SELECT COUNT(*) AS row_count FROM $table;\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
            count=$(echo "$response" | jq -r '.result[0].results[0].row_count // "query-failed"')
            echo "$table: $count"
          done

      - name: Record safety boundary
        if: always()
        run: |
          {
            echo "## D1 audit scope"
            echo "- Read-only SELECT queries only."
            echo "- No rows containing usernames, phone numbers, password hashes, session tokens, or show content were queried."
            echo "- No INSERT, UPDATE, DELETE, DROP, migration, deployment, or database mutation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
