name: Read-only Cloudflare D1 audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-live-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the D1 account and database from the deployed Worker config
        id: d1-config
        env:
          OVERRIDE_D1_ACCOUNT_ID: ${{ vars.CLOUDFLARE_D1_ACCOUNT_ID }}
        run: |
          configured_account=$(sed -n 's/^[[:space:]]*account_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' worker/wrangler.toml | head -n 1)
          configured_database=$(sed -n 's/^[[:space:]]*database_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' worker/wrangler.toml | head -n 1)
          account_id="${OVERRIDE_D1_ACCOUNT_ID:-$configured_account}"
          if [[ ! "$account_id" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::D1 account ID is missing or invalid. Configure CLOUDFLARE_D1_ACCOUNT_ID or worker/wrangler.toml."
            exit 1
          fi
          if [[ ! "$configured_database" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::D1 database ID is missing or invalid in worker/wrangler.toml."
            exit 1
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "database_id=$configured_database" >> "$GITHUB_OUTPUT"
          echo "Resolved configured D1 database: $configured_database"

      - name: Verify the Cloudflare API token itself
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          raw=$(curl --silent --show-error -w '\n%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          http_code=$(printf '%s\n' "$raw" | tail -n 1)
          response=$(printf '%s\n' "$raw" | sed '$d')
          if [[ "$http_code" != "200" ]] || [[ "$(echo "$response" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN (HTTP $http_code). Replace the GitHub Actions secret with a valid, unexpired Cloudflare API token. Never paste the token into chat or logs."
            echo "$response" | jq -r '.errors[]? | "Cloudflare error \(.code): \(.message)"' || true
            exit 1
          fi
          echo "Cloudflare API token is valid; token value was not printed."

      - name: Verify Cloudflare D1 read credentials without exposing the token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ACCOUNT_ID: ${{ steps.d1-config.outputs.account_id }}
          D1_DATABASE_ID: ${{ steps.d1-config.outputs.database_id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          raw=$(curl --silent --show-error -w '\n%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$D1_ACCOUNT_ID/d1/database")
          http_code=$(printf '%s\n' "$raw" | tail -n 1)
          response=$(printf '%s\n' "$raw" | sed '$d')
          if [[ "$http_code" != "200" ]] || [[ "$(echo "$response" | jq -r '.success // false')" != "true" ]]; then
            if [[ "$http_code" == "403" ]]; then
              echo "::error::The token is valid but lacks D1 Read access to account $D1_ACCOUNT_ID, or its account scope excludes this account."
            elif [[ "$http_code" == "401" ]]; then
              echo "::error::Cloudflare rejected the token for D1 access (HTTP 401); replace the GitHub secret with a valid token scoped to account $D1_ACCOUNT_ID and D1 Read."
            else
              echo "::error::Cloudflare D1 list request failed for configured account $D1_ACCOUNT_ID (HTTP $http_code)."
            fi
            echo "$response" | jq -r '.errors[]? | "Cloudflare error \(.code): \(.message)"' || true
            exit 1
          fi
          if ! echo "$response" | jq -e --arg id "$D1_DATABASE_ID" '.result[]? | select(.uuid == $id)' >/dev/null; then
            echo "::error::The configured D1 database ID was not found in the D1 account from worker/wrangler.toml."
            exit 1
          fi
          echo "D1 credentials and configured database access verified."

      - name: Read table names and schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ACCOUNT_ID: ${{ steps.d1-config.outputs.account_id }}
          D1_DATABASE_ID: ${{ steps.d1-config.outputs.database_id }}
        run: |
          payload=$(jq -nc --arg sql "SELECT name, sql FROM sqlite_master WHERE type = 'table' ORDER BY name;" '{sql: $sql}')
          raw=$(curl --silent --show-error -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/$D1_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
          http_code=$(printf '%s\n' "$raw" | tail -n 1)
          response=$(printf '%s\n' "$raw" | sed '$d')
          if [[ "$http_code" != "200" ]] || [[ "$(echo "$response" | jq -r '.success // false')" != "true" ]]; then
            echo "::error::D1 schema query failed (HTTP $http_code)."
            echo "$response" | jq -r '.errors[]? | "Cloudflare error \(.code): \(.message)"' || true
            exit 1
          fi
          echo "$response" | jq -r '.result[].results[] | [.name, .sql] | @tsv'

      - name: Read aggregate row counts only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ACCOUNT_ID: ${{ steps.d1-config.outputs.account_id }}
          D1_DATABASE_ID: ${{ steps.d1-config.outputs.database_id }}
        run: |
          for table in shows users sessions; do
            payload=$(jq -nc --arg table "$table" '{sql: "SELECT COUNT(*) AS row_count FROM " + $table + ";"}')
            raw=$(curl --silent --show-error -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/accounts/$D1_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/query")
            http_code=$(printf '%s\n' "$raw" | tail -n 1)
            response=$(printf '%s\n' "$raw" | sed '$d')
            if [[ "$http_code" != "200" ]] || [[ "$(echo "$response" | jq -r '.success // false')" != "true" ]]; then
              echo "::error::D1 aggregate query failed for table $table (HTTP $http_code)."
              echo "$response" | jq -r '.errors[]? | "Cloudflare error \(.code): \(.message)"' || true
              exit 1
            fi
            count=$(echo "$response" | jq -r '.result[0].results[0].row_count // "query-failed"')
            echo "$table: $count"
          done

      - name: Record safety boundary
        if: always()
        run: |
          {
            echo "## D1 audit scope"
            echo "- Read-only SELECT queries only."
            echo "- No user names, phone numbers, password hashes, session tokens, or show content were queried."
            echo "- No INSERT, UPDATE, DELETE, DROP, migration, deployment, or database mutation was performed."
          } >> "$GITHUB_STEP_SUMMARY"
