name: Visual-only Cloudflare Preview

# Live Worker deployment is exclusively owned by cloudflare-preview.yml.
# This manual workflow is intentionally build-and-test only: it must never
# deploy to or overwrite the canonical bankresaneh-visual-preview Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-visual-only-preview-check
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Build visual preview without deployment
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db
          NEXT_PUBLIC_BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE || 'https://bankresaneh-preview-api.onrender.com' }}

      - name: Verify exact branding and bundled logos in the local build
        run: node scripts/test-preview-branding.cjs

      - name: Test local Cloudflare Worker preview
        run: bun run test:cloudflare-preview
        env:
          DATABASE_URL: file:./db/custom.db
          BANKRESANEH_API_BASE: http://127.0.0.1:3002
          BANKRESANEH_ALLOWED_API_ORIGINS: http://127.0.0.1:3002
