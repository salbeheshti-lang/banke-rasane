name: Visual-only Cloudflare Preview

on:
  push:
    branches:
      - preview/visual-only

permissions:
  contents: read

concurrency:
  group: bankresaneh-visual-only-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Build visual preview
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db
          NEXT_PUBLIC_BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE }}

      - name: Test local preview
        run: bun run test:cloudflare-preview
        env:
          DATABASE_URL: file:./db/custom.db
          BANKRESANEH_API_BASE: http://127.0.0.1:3002
          BANKRESANEH_ALLOWED_API_ORIGINS: http://127.0.0.1:3002

      - name: Deploy isolated visual-only Worker
        if: ${{ vars.BANKRESANEH_API_BASE != '' }}
        run: >-
          bunx wrangler deploy --name bankresaneh-visual-preview
          --var "BANKRESANEH_API_BASE:${BANKRESANEH_API_BASE}"
          --var "BANKRESANEH_ALLOWED_API_ORIGINS:https://bankresaneh-visual-preview.ginx11x5frrby9mvb.workers.dev"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE }}

      - name: Explain skipped deployment until the real API URL is configured
        if: ${{ vars.BANKRESANEH_API_BASE == '' }}
        run: echo "Worker deployment skipped; configure BANKRESANEH_API_BASE after creating the Render API service."
