name: Visual-only Cloudflare Preview

on:
  push:
    branches:
      - preview/visual-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-visual-only-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Build visual preview
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db
          NEXT_PUBLIC_BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE || 'https://bankresaneh-preview-api.onrender.com' }}

      - name: Test local preview
        run: bun run test:cloudflare-preview
        env:
          DATABASE_URL: file:./db/custom.db
          BANKRESANEH_API_BASE: http://127.0.0.1:3002
          BANKRESANEH_ALLOWED_API_ORIGINS: http://127.0.0.1:3002

      - name: Deploy isolated visual-only Worker
        run: >-
          bunx wrangler deploy --name bankresaneh-visual-preview
          --var "BANKRESANEH_API_BASE:${BANKRESANEH_API_BASE}"
          --var "BANKRESANEH_ALLOWED_API_ORIGINS:https://bankresaneh-visual-preview.ginx11x5frrby9mvb.workers.dev"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE || 'https://bankresaneh-preview-api.onrender.com' }}

      - name: Verify the deployed Worker, organization footer, and live archive API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$WORKER_URL/" -o /tmp/bankresaneh-worker.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Deployed Worker did not become reachable."
              exit 1
            fi
            sleep 5
          done
          grep -q 'مانیتورینگ مرکز طرح و برنامه سیما' /tmp/bankresaneh-worker.html
          curl --fail --silent --show-error "$WORKER_URL/client-logo-white.png" -o /tmp/client-logo-white.png
          test -s /tmp/client-logo-white.png
          curl --fail --silent --show-error "$WORKER_URL/manifest.webmanifest" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.name!=='بانک رسانه'||m.display!=='standalone')process.exit(1);});"
          curl --fail --silent --show-error "$BANKRESANEH_API_BASE/api/health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const h=JSON.parse(s);if(h.status!=='ok'||!Number.isFinite(h.showsCount)||h.showsCount<1)process.exit(1);console.log('Live archive API ready: '+h.showsCount+' shows');});"
          echo "PASS deployed Worker serves the organization-branded login, logo asset, PWA manifest, and non-empty archive API."
        env:
          WORKER_URL: https://bankresaneh-visual-preview.ginx11x5frrby9mvb.workers.dev
          BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE || 'https://bankresaneh-preview-api.onrender.com' }}
