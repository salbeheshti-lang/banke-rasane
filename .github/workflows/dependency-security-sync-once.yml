name: One-time dependency lockfile sync and remediation

on:
  push:
    branches:
      - fix/release-readiness-v5.3.9-2026-11-07
    paths:
      - '.github/workflows/dependency-security-sync-once.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Sync package manifest and lockfile
        run: bun install

      - name: Apply available non-breaking security fixes
        shell: bash
        run: |
          set +e
          bun audit fix
          FIX_EXIT=$?
          bun audit --audit-level=high > "$RUNNER_TEMP/dependency-audit.txt" 2>&1
          AUDIT_EXIT=$?
          cat "$RUNNER_TEMP/dependency-audit.txt"
          echo "bun audit fix exit: $FIX_EXIT"
          echo "post-fix audit exit: $AUDIT_EXIT"
          exit 0

      - name: Commit lockfile changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-security-sync-once.yml
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): sync and patch audited dependencies"
            git push origin HEAD:refs/heads/fix/release-readiness-v5.3.9-2026-11-07
          fi

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-lockfile-sync
          path: ${{ runner.temp }}/dependency-audit.txt
          retention-days: 30
