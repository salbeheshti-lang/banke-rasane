name: Cloudflare account scope probe (read-only)

on:
  push:
    branches:
      - probe/cloudflare-account-scope

permissions:
  contents: read

jobs:
  check-account-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe D1 list permission on both configured accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare API token is not configured"; exit 1; }
          for account_id in 128caa74c4d03e4cf84cd0d2b3f07bbf 34fe29bd9259dcb2c47fd320f40b2eac; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database")"
            success="$(jq -r '.success // false' "$response_file")"
            code="$(jq -r '.errors[0].code // "none"' "$response_file")"
            message="$(jq -r '.errors[0].message // "none"' "$response_file")"
            if [[ "$status" == "200" && "$success" == "true" ]]; then
              names="$(jq -r '[.result[].name] | join(", ")' "$response_file")"
              echo "account=$account_id HTTP=$status success=true databases=$names"
            else
              echo "account=$account_id HTTP=$status success=$success error_code=$code message=$message"
            fi
            rm -f "$response_file"
          done
