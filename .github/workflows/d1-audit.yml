name: Audit existing Cloudflare D1
on:
  push:
    branches:
      - ops/d1-audit-check
permissions:
  contents: read
jobs:
  inspect-existing-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Verify D1 token and locate the existing database
        env:
          CF_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_D1_TOKEN" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_D1_API_TOKEN is missing or empty."
            exit 1
          fi
          # Cloudflare account IDs are 32-character hex strings. The repository
          # variable currently contains a UUID, so also test the two account IDs
          # recorded in the earlier D1 setup history. Read-only enumeration only.
          candidates=("$CONFIGURED_ACCOUNT_ID" "34fe29bd9259dcb2c47fd320f40b2eac" "128caa74c4d03e4cf84cd0d2b3f07bbf")
          for account in "${candidates[@]}"; do
            [[ "$account" =~ ^[a-fA-F0-9]{32}$ ]] || continue
            status=$(curl --silent --show-error -o /tmp/d1-databases.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_D1_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$account/d1/database")
            if [[ "$status" != "200" ]]; then
              echo "D1 listing not available for candidate account (HTTP $status); trying next."
              continue
            fi
            node - "$account" <<'NODE'
          const fs = require('node:fs');
          const account = process.argv[2];
          const payload = JSON.parse(fs.readFileSync('/tmp/d1-databases.json', 'utf8'));
          if (!payload.success) process.exit(3);
          const dbs = payload.result || [];
          const target = dbs.find(db => db.name === 'banke-rasane-db');
          if (!target) {
            console.log('Account is accessible, but banke-rasane-db is not listed here.');
            process.exit(4);
          }
          console.log('Existing D1 database located successfully.');
          console.log('Database name:', target.name);
          console.log('Database UUID:', target.uuid);
          console.log('Account ID:', account);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Existing D1 database found\n- Name: `' + target.name + '`\n- UUID: `' + target.uuid + '`\n- Account ID: `' + account + '`\n');
          NODE
            result=$?
            if [[ "$result" -eq 0 ]]; then exit 0; fi
          done
          echo "::error::Could not locate banke-rasane-db. Check that the token is scoped to the account containing that database and has Account D1 Read."
          exit 1
