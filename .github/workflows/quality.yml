name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/complete-v5.3.1-mainline]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Lint
        run: bun run lint

      - name: API smoke runner syntax
        run: node --check scripts/smoke-api.cjs

      - name: API integration smoke test
        run: node scripts/smoke-api.cjs

      - name: Production build
        run: bun run build

      - name: Type check
        run: bun run typecheck
