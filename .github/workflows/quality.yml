name: Quality checks

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Test persistent Prisma SQLite runtime
        run: bun scripts/test-prisma-runtime.ts

      - name: Test API video upload validation
        run: node --test mini-services/api-service/video-validation.test.mjs

      - name: Audit bundled archive seed data
        run: bun run test:seed-data

      - name: Test API CRUD, duplicate protection, and shared genre files
        run: bun run test:api-crud
        env:
          BUN_BINARY: bun

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Test authenticated Next.js API routes against a real Bun API
        run: bun run test:next-api
        env:
          BUN_BINARY: bun

      - name: Type check
        run: bun run typecheck
