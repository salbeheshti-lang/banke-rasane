name: Quality checks

on:
  push:
    branches: [main, fix/complete-v5.3.1-mainline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Report all dependency advisories
        shell: bash
        run: bun audit || true

      - name: Audit dependencies (high and critical)
        run: bun audit --audit-level=high

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Test persistent Prisma SQLite runtime
        run: bun scripts/test-prisma-runtime.ts

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Type check
        run: bun run typecheck