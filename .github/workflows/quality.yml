name: Quality checks

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, 'fix/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Test API video upload validation
        run: node --test mini-services/api-service/video-validation.test.mjs

      - name: Audit bundled archive seed data
        run: bun run test:seed-data

      - name: Compare bundled archive with all checked-in seed sources
        run: bun run test:seed-sources

      - name: Test API CRUD, duplicate protection, and shared genre files
        run: bun run test:api-crud
        env:
          BUN_BINARY: bun

      - name: Verify native XLSX and Persian PDF generation
        run: bun run test:export

      - name: Verify backend translation rate-limit concurrency and persistence
        run: bun run test:rate-limit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Test authenticated Next.js API routes against a real Bun API
        run: bun run test:next-api
        env:
          BUN_BINARY: bun

      - name: Type check
        run: bun run typecheck

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --no-save
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Run PWA and browser login flows
        run: bun run test:e2e
        env:
          CI: 'true'
          DATABASE_URL: file:./db/custom.db

  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --no-save
      - name: Build OpenNext Cloudflare Worker (no deployment)
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db
