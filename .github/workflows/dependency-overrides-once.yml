name: One-time scoped dependency override validation

on:
  push:
    branches:
      - fix/release-readiness-v5.3.9-2026-11-07
    paths:
      - '.github/workflows/dependency-overrides-once.yml'

permissions:
  contents: write

jobs:
  lock-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Resolve scoped patched versions
        run: bun install

      - name: Run high and critical dependency audit
        shell: bash
        run: |
          set +e
          bun audit --audit-level=high > "$RUNNER_TEMP/dependency-audit.txt" 2>&1
          AUDIT_EXIT=$?
          cat "$RUNNER_TEMP/dependency-audit.txt"
          echo "post-override audit exit: $AUDIT_EXIT"
          exit 0

      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dependency-overrides-once.yml
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): lock patched transitive security versions"
            git push origin HEAD:refs/heads/fix/release-readiness-v5.3.9-2026-11-07
          fi

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-scoped-overrides
          path: ${{ runner.temp }}/dependency-audit.txt
          retention-days: 30
