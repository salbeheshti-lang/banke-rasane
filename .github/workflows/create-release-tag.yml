name: Create release tag from release branch

on:
  create:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  create-tag:
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Validate release branch against package version
        id: validate
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          branch_tag="${GITHUB_REF#refs/heads/release/}"
          expected="v${version}"
          if [[ "$branch_tag" != "$expected" ]]; then
            echo "Release branch $branch_tag does not match package version $expected"
            exit 1
          fi
          echo "tag=$branch_tag" >> "$GITHUB_OUTPUT"

      - name: Create matching Git tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} already exists; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });
            core.notice(`Created ${tag} at ${context.sha}`);
