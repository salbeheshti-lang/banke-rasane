name: Create release tag (manual approval only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (must match package.json, e.g. v5.4.5)"
        required: true
        type: string
      confirm:
        description: "I explicitly approve creating this Git tag and dispatching the Windows release build"
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    if: inputs.confirm == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Require current main and successful CI on the exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/main') {
              throw new Error(`Release dispatch must target refs/heads/main, not ${context.ref}`);
            }
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.commit.sha !== context.sha) {
              throw new Error(`Selected SHA ${context.sha} is not current main ${main.commit.sha}; refresh main and rerun`);
            }
            const required = [
              { name: 'Quality checks', id: 403337967 },
              { name: 'Security tests', id: 406811866 },
              { name: 'Windows desktop build', id: 404056691 },
            ];
            for (const workflow of required) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow.id,
                branch: 'main', head_sha: context.sha, per_page: 100,
              });
              const passing = data.workflow_runs.some(run =>
                run.head_sha === context.sha &&
                run.event === 'push' &&
                run.status === 'completed' &&
                run.conclusion === 'success'
              );
              if (!passing) {
                throw new Error(`Required workflow "${workflow.name}" has no successful push run for exact SHA ${context.sha}`);
              }
              core.info(`Verified ${workflow.name} on ${context.sha}`);
            }

      - name: Validate requested tag against package version and reject existing tags
        id: validate
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          tag="$(printf '%s' "$REQUESTED_TAG" | tr -d '[:space:]')"
          if [[ "$tag" != "$expected" ]]; then
            echo "Requested tag $tag does not match package version $expected"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to move or redispatch it."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create matching Git tag and dispatch Windows release build
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            await github.rest.git.createRef({
              owner, repo, ref: `refs/tags/${tag}`, sha: context.sha,
            });
            core.notice(`Created ${tag} at verified main SHA ${context.sha}`);
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'build-exe.yml', ref: tag,
            });
            core.notice(`Dispatched Windows release build for ${tag}`);

  approval-required:
    if: inputs.confirm != true
    runs-on: ubuntu-latest
    steps:
      - name: Stop without explicit approval
        run: echo "No tag created. Set confirm=true only after explicit release approval."
