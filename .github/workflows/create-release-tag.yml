name: Create release tag (manual approval only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (must match package.json, e.g. v5.4.4)"
        required: true
        type: string
      confirm:
        description: "I explicitly approve creating this Git tag and dispatching the Windows release build"
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    if: inputs.confirm == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Validate requested tag against package version
        id: validate
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          tag="$(printf '%s' "$REQUESTED_TAG" | tr -d '[:space:]')"
          if [[ "$tag" != "$expected" ]]; then
            echo "Requested tag $tag does not match package version $expected"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create matching Git tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            let tagExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagExists = true;
              core.info(`Tag ${tag} already exists; dispatching its release build.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!tagExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.notice(`Created ${tag} at ${context.sha}`);
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'build-exe.yml',
              ref: tag,
            });
            core.notice(`Dispatched Windows release build for ${tag}`);

  approval-required:
    if: inputs.confirm != true
    runs-on: ubuntu-latest
    steps:
      - name: Stop without explicit approval
        run: echo "No tag created. Set confirm=true only after explicit release approval."
