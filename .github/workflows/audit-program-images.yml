name: Audit program decor images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/media-excel-preview-stability-2026-11-26]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-decor-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Audit seed images, source availability, and attribution
        run: node scripts/audit-program-images.mjs
