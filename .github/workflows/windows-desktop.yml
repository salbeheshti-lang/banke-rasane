name: Windows desktop build

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, 'fix/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Test real API CRUD, duplicate protection, and missing-show recovery
        run: bun run test:api-crud

      - name: Check Electron main-process syntax
        run: node --check electron/main.js

      - name: Lint
        run: bun run lint

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/electron-builder
            .ci-cache/electron
          key: windows-electron-builder-v3-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*', 'package-lock.json') }}
          restore-keys: |
            windows-electron-builder-v3-${{ runner.os }}-

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== Electron build attempt $attempt/$maxAttempts ==="
            npm run electron:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = [Math]::Min(180, [int](10 * [Math]::Pow(2, $attempt - 1)))
              Write-Warning "Build failed (exit $LASTEXITCODE). Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          throw "Electron build failed after $maxAttempts attempts."
        env:
          DATABASE_URL: file:./db/custom.db
          DEBUG: electron-builder
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron

      - name: Build audited 5.4.4 baseline installer for exact in-place upgrade test
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          $baselineSha = '7a34151e4a9e18fe8988c91f86b0462d5d7e2b20'
          $baselineDir = Join-Path $env:RUNNER_TEMP 'BankResaneh-5.4.4-source'
          $baselineSetup = Join-Path $env:RUNNER_TEMP 'BankResaneh-5.4.4-Setup.exe'
          git fetch --no-tags --depth=1 origin $baselineSha
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch audited 5.4.4 baseline commit.' }
          git worktree add --detach $baselineDir $baselineSha
          if ($LASTEXITCODE -ne 0) { throw 'Could not create 5.4.4 baseline worktree.' }
          try {
            Push-Location $baselineDir
            bun install --no-save
            if ($LASTEXITCODE -ne 0) { throw '5.4.4 baseline dependency installation failed.' }
            npm run electron:build
            if ($LASTEXITCODE -ne 0) { throw '5.4.4 baseline installer build failed.' }
            $setup = Get-ChildItem (Join-Path $baselineDir 'release') -Filter '*Setup*.exe' | Select-Object -First 1
            if (-not $setup) { throw '5.4.4 baseline installer was not produced.' }
            Copy-Item $setup.FullName $baselineSetup -Force
            if ((Get-Item $baselineSetup).Length -lt 100MB) { throw '5.4.4 baseline installer is incomplete.' }
          } finally {
            Pop-Location
            git worktree remove --force $baselineDir
          }
          Write-Host "PASS: built the audited package-version 5.4.4 baseline from $baselineSha."
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron

      - name: Verify published 5.3.9 to current-version in-place upgrade
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'BankResaneh-Upgrade-Test'
          $oldSetup = Join-Path $env:RUNNER_TEMP 'BankResaneh-5.3.9-Setup.exe'
          $newSetup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $newSetup) { throw 'Current-version NSIS installer was not produced.' }
          Invoke-WebRequest -Uri 'https://github.com/salbeheshti-lang/banke-rasane/releases/download/v5.3.9/BankResaneh-Setup.exe' -OutFile $oldSetup
          if ((Get-Item $oldSetup).Length -lt 100MB) { throw 'Published 5.3.9 installer download is incomplete.' }

          function Install-App([string]$Path, [string]$Log) {
            $p = Start-Process -FilePath $Path -ArgumentList @('/S', "/LOG=$Log", "/D=$installDir") -PassThru
            if (-not $p.WaitForExit(600000)) { try { & taskkill.exe /PID $p.Id /T /F | Out-Null } catch {}; throw "Installer timed out: $Path" }
            if ($p.ExitCode -ne 0) { if (Test-Path $Log) { Get-Content $Log -Tail 100 }; throw "Installer failed: $Path (exit $($p.ExitCode))" }
          }

          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          Install-App $oldSetup (Join-Path $env:RUNNER_TEMP 'install-539.log')
          $exe = Join-Path $installDir 'BankResaneh.exe'
          node scripts/smoke-electron.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw '5.3.9 baseline startup/API/DB smoke test failed.' }

          # Reproduce the exact package version already installed by the user.
          $baselineSetup = Join-Path $env:RUNNER_TEMP 'BankResaneh-5.4.4-Setup.exe'
          if (-not (Test-Path $baselineSetup)) { throw 'Audited 5.4.4 baseline installer is missing.' }
          Install-App $baselineSetup (Join-Path $env:RUNNER_TEMP 'upgrade-539-to-544.log')
          node scripts/smoke-electron.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw '5.4.4 baseline startup/API/DB smoke test failed.' }

          $userData = Join-Path $env:APPDATA 'banke-rasane'
          $db = Join-Path $userData 'db\\bankresaneh.sqlite'
          if (-not (Test-Path $db)) { throw '5.4.4 baseline did not create the real persistent SQLite database.' }
          $snapshot = @{}
          Get-ChildItem $userData -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($userData.Length).TrimStart('\\')
            $snapshot[$rel] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }
          Set-Content (Join-Path $userData 'upgrade-sentinel.txt') 'created-under-5.4.4' -NoNewline
          $snapshot['upgrade-sentinel.txt'] = (Get-FileHash (Join-Path $userData 'upgrade-sentinel.txt') -Algorithm SHA256).Hash

          Install-App $newSetup.FullName (Join-Path $env:RUNNER_TEMP 'upgrade-544-to-545.log')
          foreach ($rel in $snapshot.Keys) {
            $file = Join-Path $userData $rel
            if (-not (Test-Path $file -PathType Leaf)) { throw "Upgrade deleted user data: $rel" }
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $snapshot[$rel]) { throw "Upgrade changed user data: $rel" }
          }
          $env:BANKRESANEH_VERIFY_VIDEO_EXPORT = '1'
          node scripts/smoke-electron.cjs "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded application failed startup/API/DB/video smoke test.' }
          Remove-Item Env:BANKRESANEH_VERIFY_VIDEO_EXPORT -ErrorAction SilentlyContinue
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "PASS: 5.3.9 -> audited 5.4.4 -> candidate $packageVersion in-place upgrade; $($snapshot.Count) persistent files including SQLite survived the 5.4.4 -> candidate step byte-for-byte."

      - name: Run packaged app smoke test
        run: npm run smoke:desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: banke-rasane-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
