name: Windows desktop build

on:
  push:
    branches: [fix/complete-v5.3.1-mainline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Test persistent Prisma SQLite runtime
        run: bun scripts/test-prisma-runtime.ts

      - name: Check Electron main-process syntax
        run: node --check electron/main.js

      - name: Lint
        run: bun run lint

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/electron-builder
            .ci-cache/electron
          key: windows-electron-builder-v2-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock*', 'package-lock.json') }}
          restore-keys: |
            windows-electron-builder-v2-${{ runner.os }}-

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== Electron build attempt $attempt/$maxAttempts ==="
            npm run electron:build
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Electron build completed successfully."
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              $delay = [Math]::Min(180, [int](10 * [Math]::Pow(2, $attempt - 1)))
              Write-Warning "Build failed (exit $LASTEXITCODE). Retrying in $delay seconds; cached downloads will be reused."
              Start-Sleep -Seconds $delay
            }
          }
          throw "Electron build failed after $maxAttempts attempts. Inspect DEBUG=electron-builder output above."
        env:
          DATABASE_URL: file:./db/custom.db
          DEBUG: electron-builder
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.ci-cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.ci-cache/electron

      - name: Run packaged app smoke test
        run: npm run smoke:desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: banke-rasane-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
