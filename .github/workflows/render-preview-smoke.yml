name: Render Preview Browser Verification

on:
  push:
    branches:
      - fix/preview-mobile-menu-auth-archive-2026-11-27
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-render-preview-smoke
  cancel-in-progress: true

jobs:
  desktop-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Wait for the free Frankfurt Render preview
        shell: bash
        env:
          PREVIEW_URL: https://bankresaneh-preview-web.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            status=$(curl --silent --output /tmp/render-preview.html --write-out '%{http_code}' --max-time 20 "$PREVIEW_URL/" || true)
            if [[ "$status" == "200" ]] && grep -q '_next/static' /tmp/render-preview.html; then
              echo "Render preview root is responding with HTTP 200."
              exit 0
            fi
            echo "Render preview not ready yet (attempt $attempt/36, HTTP ${status:-none})."
            sleep 10
          done
          echo "::error::Render preview did not become ready within six minutes."
          exit 1

      - name: Verify Render preview API proxy and archive
        shell: bash
        env:
          PREVIEW_URL: https://bankresaneh-preview-web.onrender.com
          API_BASE: https://bankresaneh-preview-api.onrender.com
        run: |
          set -euo pipefail
          proxy_status=$(curl --silent --output /tmp/render-preview-proxy.json --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL/api/shows?page=1&limit=1")
          [[ "$proxy_status" == "401" ]] || { echo "::error::Same-origin API proxy should forward to the protected archive endpoint (expected 401 without a session, got $proxy_status)."; cat /tmp/render-preview-proxy.json; exit 1; }
          grep -qi 'Unauthorized' /tmp/render-preview-proxy.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors "$API_BASE/api/health" -o /tmp/render-preview-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/render-preview-health.json','utf8'));if(h.status!=='ok'||h.showsCount!==1302)throw Error('Render API archive health mismatch: '+JSON.stringify(h));console.log('Render API proxy is connected; backend archive total: '+h.showsCount);"

      - name: Verify desktop and mobile browser layouts
        run: node scripts/test-live-preview-browser.cjs
        env:
          WORKER_URL: https://bankresaneh-preview-web.onrender.com

      - name: Upload Render browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankresaneh-render-preview-browser-diagnostics
          path: artifacts/live-preview/
          if-no-files-found: warn
          retention-days: 14
