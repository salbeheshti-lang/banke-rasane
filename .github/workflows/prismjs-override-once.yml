name: One-time PrismJS lockfile remediation

on:
  push:
    branches:
      - fix/release-readiness-v5.3.9-2026-11-07
    paths:
      - '.github/workflows/prismjs-override-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Regenerate lockfile
        run: bun install

      - name: Report all advisories and enforce high/critical gate
        shell: bash
        run: |
          set +e
          bun audit > "$RUNNER_TEMP/dependency-audit-all.txt" 2>&1
          FULL_EXIT=$?
          bun audit --audit-level=high > "$RUNNER_TEMP/dependency-audit-high.txt" 2>&1
          HIGH_EXIT=$?
          cat "$RUNNER_TEMP/dependency-audit-all.txt"
          echo "full audit exit: $FULL_EXIT"
          echo "high/critical audit exit: $HIGH_EXIT"
          exit 0

      - name: Commit lockfile and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prismjs-override-once.yml
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): lock patched PrismJS dependency"
            git push origin HEAD:refs/heads/fix/release-readiness-v5.3.9-2026-11-07
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-prismjs-remediation
          path: ${{ runner.temp }}/dependency-audit-*.txt
          retention-days: 30
