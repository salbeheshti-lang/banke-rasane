name: Cloudflare full preview

on:
  push:
    branches:
      - cloudflare/full-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BANKRESANEH_API_BASE: https://bankresaneh-preview-api.onrender.com

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client for type-checking
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Install Cloudflare adapter and Wrangler for this CI run
        run: bun add --dev @opennextjs/cloudflare@1.20.18 wrangler@4.68.0

      - name: Build Next.js for Cloudflare Workers
        run: bunx opennextjs-cloudflare build

      - name: Validate Worker bundle without publishing
        run: bunx wrangler deploy --dry-run

      - name: Install API service dependencies
        working-directory: mini-services/api-service
        run: bun install

      - name: Smoke-test the updated Bun API locally
        shell: bash
        run: |
          set -euo pipefail
          PORT=3456 BANKRESANEH_HOST=127.0.0.1 DB_PATH=/tmp/bankresaneh-preview-smoke.sqlite BANKRESANEH_SEED_PATH="$GITHUB_WORKSPACE/public/talk-shows-data.json" bun mini-services/api-service/index.js > /tmp/bankresaneh-api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/api-smoke-health.json --write-out '%{http_code}' --max-time 3 http://127.0.0.1:3456/api/health || true)"
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/api-smoke-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/bankresaneh-api-smoke.log
            echo "::error::Local Bun API did not become healthy."
            exit 1
          fi
          cat /tmp/api-smoke-health.json
          grep -q '"showsCount":1302' /tmp/api-smoke-health.json
          for endpoint in translation/rate-limit settings/report; do
            status="$(curl --silent --output /tmp/api-smoke-auth.json --write-out '%{http_code}' --max-time 5 -X POST "http://127.0.0.1:3456/api/$endpoint" || true)"
            if [ "$status" != "401" ]; then
              cat /tmp/api-smoke-auth.json || true
              echo "::error::Expected unauthenticated POST /api/$endpoint to return 401; got ${status:-no-response}."
              exit 1
            fi
          done
          logo_status="$(curl --silent --output /tmp/api-smoke-logo.json --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3456/api/settings/logo || true)"
          if [ "$logo_status" != "404" ]; then
            cat /tmp/api-smoke-logo.json || true
            echo "::error::Expected no stored logo to return 404; got ${logo_status:-no-response}."
            exit 1
          fi
          echo "Bun API health, 1302-show seed, auth gates, and settings routes passed."

      - name: Verify preview API before publishing the frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking ${BANKRESANEH_API_BASE}/api/health"
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output /tmp/api-health.json --write-out '%{http_code}' --max-time 25 "${BANKRESANEH_API_BASE}/api/health" || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/api-health.json
              if grep -q '"status":"ok"' /tmp/api-health.json; then
                echo "Preview API health check passed."
                exit 0
              fi
            fi
            echo "Preview API not ready yet (HTTP ${status:-no-response}); attempt $attempt/12."
            sleep 10
          done
          echo "::error::Preview API did not pass /api/health. Frontend deployment was stopped to avoid publishing a broken preview."
          exit 1

      - name: Verify the updated API includes the persistent translation limiter
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/rate-limit-health.json --write-out '%{http_code}' --max-time 15 -X POST "${BANKRESANEH_API_BASE}/api/translation/rate-limit" || true)"
          if [ "$status" != "401" ]; then
            cat /tmp/rate-limit-health.json || true
            echo "::error::Preview API has not deployed the new translation rate-limit route (expected HTTP 401 without auth, got ${status:-no-response})."
            exit 1
          fi
          echo "Preview API translation rate-limit route is deployed and rejects unauthenticated requests."

      - name: Deploy preview Worker
        run: bunx opennextjs-cloudflare deploy
