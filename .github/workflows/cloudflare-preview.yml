name: Cloudflare Preview

on:
  push:
    branches:
      - fix/audit-hardening-5.4.5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check preview configuration
        id: config
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE: ${{ vars.BANKRESANEH_API_BASE }}
          API_ALLOWLIST: ${{ vars.BANKRESANEH_ALLOWED_API_ORIGINS }}
        run: |
          if [[ -n "$CF_TOKEN" && -n "$CF_ACCOUNT" && -n "$API_BASE" && -n "$API_ALLOWLIST" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deployment skipped. Configure CLOUDFLARE_API_TOKEN and the three repository variables documented in CLOUDFLARE.md."
            echo "Preview deployment is not configured yet. Add CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID, BANKRESANEH_API_BASE, BANKRESANEH_ALLOWED_API_ORIGINS variables." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bun install --no-save

      - name: Build Cloudflare Worker
        if: steps.config.outputs.ready == 'true'
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Deploy isolated preview Worker
        if: steps.config.outputs.ready == 'true'
        run: |
          bunx wrangler deploy --name bankresaneh-preview \
            --var "BANKRESANEH_API_BASE:${BANKRESANEH_API_BASE}" \
            --var "BANKRESANEH_ALLOWED_API_ORIGINS:${BANKRESANEH_ALLOWED_API_ORIGINS}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE }}
          BANKRESANEH_ALLOWED_API_ORIGINS: ${{ vars.BANKRESANEH_ALLOWED_API_ORIGINS }}
