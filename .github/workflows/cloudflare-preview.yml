name: Cloudflare Preview

on:
  push:
    branches:
      - fix/audit-hardening-5.4.5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    # Preview deployment is intentionally skipped until the Cloudflare account
    # and a separately hosted persistent API are configured in repository settings.
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.BANKRESANEH_API_BASE != '' && vars.BANKRESANEH_ALLOWED_API_ORIGINS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Build Cloudflare Worker
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Deploy isolated preview Worker
        run: |
          bunx wrangler deploy --name bankresaneh-preview \
            --var "BANKRESANEH_API_BASE:${BANKRESANEH_API_BASE}" \
            --var "BANKRESANEH_ALLOWED_API_ORIGINS:${BANKRESANEH_ALLOWED_API_ORIGINS}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BANKRESANEH_API_BASE: ${{ vars.BANKRESANEH_API_BASE }}
          BANKRESANEH_ALLOWED_API_ORIGINS: ${{ vars.BANKRESANEH_ALLOWED_API_ORIGINS }}

      - name: Explain missing preview configuration
        if: ${{ always() && (secrets.CLOUDFLARE_API_TOKEN == '' || vars.CLOUDFLARE_ACCOUNT_ID == '' || vars.BANKRESANEH_API_BASE == '' || vars.BANKRESANEH_ALLOWED_API_ORIGINS == '') }}
        run: |
          echo "Preview deployment skipped: configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID, BANKRESANEH_API_BASE, BANKRESANEH_ALLOWED_API_ORIGINS repository variables." >> "$GITHUB_STEP_SUMMARY"
