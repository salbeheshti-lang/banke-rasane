name: Cloudflare full preview
# Preview deployment trigger: keep this workflow scoped to cloudflare/full-preview.

on:
  push:
    branches:
      - cloudflare/full-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankresaneh-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BANKRESANEH_API_BASE: https://bankresaneh-preview-api.onrender.com
      PREVIEW_URL: https://bankresaneh-visual-preview.bankresaneh.workers.dev

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client for type-checking
        run: bunx prisma generate
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Install Cloudflare adapter and Wrangler for this CI run
        run: bun add --dev @opennextjs/cloudflare@1.20.18 wrangler@4.68.0

      - name: Build Next.js for Cloudflare Workers
        run: bunx opennextjs-cloudflare build

      - name: Validate Worker bundle without publishing
        run: bunx wrangler deploy --dry-run

      - name: Install API service dependencies
        working-directory: mini-services/api-service
        run: bun install

      - name: Smoke-test the updated Bun API locally
        shell: bash
        run: |
          set -euo pipefail
          PORT=3456 BANKRESANEH_HOST=127.0.0.1 DB_PATH=/tmp/bankresaneh-preview-smoke.sqlite BANKRESANEH_SEED_PATH="$GITHUB_WORKSPACE/public/talk-shows-data.json" bun mini-services/api-service/index.js > /tmp/bankresaneh-api-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/api-smoke-health.json --write-out '%{http_code}' --max-time 3 http://127.0.0.1:3456/api/health || true)"
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/api-smoke-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/bankresaneh-api-smoke.log
            echo "::error::Local Bun API did not become healthy."
            exit 1
          fi
          cat /tmp/api-smoke-health.json
          grep -q '"showsCount":1302' /tmp/api-smoke-health.json
          for endpoint in translation/rate-limit settings/report; do
            status="$(curl --silent --output /tmp/api-smoke-auth.json --write-out '%{http_code}' --max-time 5 -X POST "http://127.0.0.1:3456/api/$endpoint" || true)"
            if [ "$status" != "401" ]; then
              cat /tmp/api-smoke-auth.json || true
              echo "::error::Expected unauthenticated POST /api/$endpoint to return 401; got ${status:-no-response}."
              exit 1
            fi
          done
          logo_status="$(curl --silent --output /tmp/api-smoke-logo.json --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3456/api/settings/logo || true)"
          if [ "$logo_status" != "404" ]; then
            cat /tmp/api-smoke-logo.json || true
            echo "::error::Expected no stored logo to return 404; got ${logo_status:-no-response}."
            exit 1
          fi
          echo "Bun API health, 1302-show seed, auth gates, and settings routes passed."

      - name: Verify preview API before publishing the frontend
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking ${BANKRESANEH_API_BASE}/api/health"
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output /tmp/api-health.json --write-out '%{http_code}' --max-time 25 "${BANKRESANEH_API_BASE}/api/health" || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/api-health.json
              if grep -q '"status":"ok"' /tmp/api-health.json && grep -q '"showsCount":1302' /tmp/api-health.json; then
                echo "Preview API health and 1302-show archive check passed."
                exit 0
              fi
            fi
            echo "Preview API not ready yet (HTTP ${status:-no-response}); attempt $attempt/12."
            sleep 10
          done
          echo "::error::Preview API did not pass /api/health. Frontend deployment was stopped to avoid publishing a broken preview."
          exit 1

      - name: Verify the updated API includes the persistent translation limiter
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/rate-limit-health.json --write-out '%{http_code}' --max-time 15 -X POST "${BANKRESANEH_API_BASE}/api/translation/rate-limit" || true)"
          if [ "$status" != "401" ]; then
            cat /tmp/rate-limit-health.json || true
            echo "::error::Preview API has not deployed the new translation rate-limit route (expected HTTP 401 without auth, got ${status:-no-response})."
            exit 1
          fi
          echo "Preview API translation rate-limit route is deployed and rejects unauthenticated requests."

      - name: Deploy preview Worker
        run: bunx opennextjs-cloudflare deploy

      - name: Verify deployed organization logo and login proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            logo_status="$(curl --silent --show-error --output /tmp/preview-logo.png --write-out '%{http_code}' --max-time 20 "${PREVIEW_URL}/banke-rasane-logo.png" || true)"
            if [ "$logo_status" = "200" ] && file /tmp/preview-logo.png | grep -qi 'PNG image'; then
              break
            fi
            echo "Logo asset not ready (HTTP ${logo_status:-no-response}); attempt $attempt/12."
            sleep 5
          done
          if [ "${logo_status:-}" != "200" ] || ! file /tmp/preview-logo.png | grep -qi 'PNG image'; then
            echo "::error::The deployed organization logo is missing or invalid."
            exit 1
          fi
          login_status="$(curl --silent --show-error --output /tmp/preview-login.json --write-out '%{http_code}' --max-time 20 -H 'Content-Type: application/json' -X POST --data '{}' "${PREVIEW_URL}/api/auth/login" || true)"
          if [ "$login_status" != "400" ]; then
            cat /tmp/preview-login.json || true
            echo "::error::Expected the proxied login endpoint to reject an empty payload with HTTP 400; got ${login_status:-no-response}."
            exit 1
          fi
          echo "Deployed organization logo is a valid PNG and the login proxy reaches the API."

      - name: Smoke-test the public preview page and browser API proxy
        shell: bash
        run: |
          set -euo pipefail
          page_status="$(curl --silent --show-error --output /tmp/preview-home.html --write-out '%{http_code}' --max-time 25 "${PREVIEW_URL}/" || true)"
          if [ "$page_status" != "200" ] || ! grep -Eqi '<html|<!doctype html' /tmp/preview-home.html; then
            cat /tmp/preview-home.html || true
            echo "::error::Preview home page did not return a valid HTML document (HTTP ${page_status:-no-response})."
            exit 1
          fi
          asset_path="$(grep -Eo '/_next/static/[^" ]+\.js' /tmp/preview-home.html | head -n 1 || true)"
          if [ -z "$asset_path" ]; then
            echo "::error::Preview home page did not reference a Next.js JavaScript bundle."
            exit 1
          fi
          asset_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${PREVIEW_URL}${asset_path}" || true)"
          if [ "$asset_status" != "200" ]; then
            echo "::error::Preview JavaScript bundle failed (HTTP ${asset_status:-no-response})."
            exit 1
          fi
          # The archive is intentionally private: without a bearer token the
          # correct response is 401. This verifies the Worker proxy forwards
          # the request to the protected API instead of exposing archive data.
          api_status="$(curl --silent --show-error --output /tmp/preview-shows.json --write-out '%{http_code}' --max-time 25 "${PREVIEW_URL}/api/shows?page=1&limit=1" || true)"
          if [ "$api_status" != "401" ] || ! grep -q '"error":"Unauthorized"' /tmp/preview-shows.json; then
            cat /tmp/preview-shows.json || true
            echo "::error::Preview browser API proxy did not enforce the expected authentication gate (HTTP ${api_status:-no-response})."
            exit 1
          fi
          echo "Preview HTML, JavaScript bundle, and protected browser API proxy all passed."

      - name: Verify the actual login screen in Chromium
        shell: bash
        run: |
          set -euo pipefail
          bun add --dev playwright@1.56.1
          bunx playwright install --with-deps chromium
          bun -e '
            import { chromium } from "playwright";
            const url = process.env.PREVIEW_URL;
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const failures = [];
              const staticFailures = [];
              const isStaticAsset = value => {
                const path = new URL(value).pathname.toLowerCase();
                return (path.includes("/_next/static/") && (path.endsWith(".js") || path.endsWith(".css"))) ||
                  (path.startsWith("/fonts/") && (path.endsWith(".woff") || path.endsWith(".woff2") || path.endsWith(".ttf")));
              };
              page.on("pageerror", error => failures.push("pageerror: " + error.message));
              page.on("console", message => {
                if (message.type() === "error") failures.push("console: " + message.text());
              });
              page.on("requestfailed", request => {
                if (isStaticAsset(request.url())) {
                  staticFailures.push(request.url() + " => " + (request.failure()?.errorText || "request failed"));
                }
              });
              page.on("response", response => {
                if (response.status() >= 400 && isStaticAsset(response.url())) {
                  staticFailures.push(response.url() + " => HTTP " + response.status());
                }
              });
              await page.goto(url, { waitUntil: "networkidle", timeout: 90000 });
              await page.evaluate(() => document.fonts.ready);
              await page.locator("#login-username").waitFor({ state: "visible", timeout: 30000 });
              await page.locator("#login-password").waitFor({ state: "visible", timeout: 10000 });
              if (await page.locator(".login-screen").count() !== 1) {
                throw new Error("Login screen container did not render exactly once.");
              }
              if (failures.length || staticFailures.length) {
                throw new Error("Browser errors: " + failures.join(" | ") + "; static asset transfer errors: " + staticFailures.join(" | "));
              }
              const resources = await page.evaluate(() => performance.getEntriesByType("resource")
                .filter(entry => {
                  const path = new URL(entry.name).pathname.toLowerCase();
                  return (path.includes("/_next/static/") && (path.endsWith(".js") || path.endsWith(".css"))) ||
                    (path.startsWith("/fonts/") && (path.endsWith(".woff") || path.endsWith(".woff2") || path.endsWith(".ttf")));
                })
                .map(entry => ({ url: entry.name, bytes: entry.transferSize, duration: Math.round(entry.duration) }));
              if (!resources.some(item => item.url.toLowerCase().endsWith(".js"))) throw new Error("No JavaScript bundle was transferred in Chromium.");
              if (!resources.some(item => item.url.toLowerCase().endsWith(".woff") || item.url.toLowerCase().endsWith(".woff2"))) throw new Error("No local font was transferred in Chromium.");
              console.log("PASS: Chromium rendered login and transferred all JS/CSS/font resources: " + JSON.stringify(resources));
              await page.evaluate(() => localStorage.setItem("bankresaneh_token", "stale-preview-smoke-token"));
              await page.reload({ waitUntil: "domcontentloaded", timeout: 45000 });
              await page.locator("#login-username").waitFor({ state: "visible", timeout: 15000 });
              await page.locator("#login-password").waitFor({ state: "visible", timeout: 10000 });
              console.log("PASS: A stale saved token returns to the login screen instead of leaving the green loading screen stuck.");
            } finally {
              await browser.close();
            }
          '

# Re-run Chromium login verification on the preview branch.
