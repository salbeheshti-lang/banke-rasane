name: Preview sync validation

on:
  pull_request:
    branches:
      - preview/visual-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --no-save

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test video validation, real MP4 transcoding, and safe image optimization
        run: |
          node --test mini-services/api-service/video-validation.test.mjs
          node --test mini-services/api-service/video-transcode.test.mjs
          node --test mini-services/api-service/image-import.test.mjs

      - name: Build the exact Cloudflare Worker bundle
        run: bun run cloudflare:build
        env:
          DATABASE_URL: file:./db/custom.db
          NEXT_PUBLIC_BANKRESANEH_API_BASE: https://bankresaneh-preview-api.onrender.com

      - name: Verify preview branding, logo assets, and required UI features
        run: node scripts/test-preview-branding.cjs

      - name: Test local Cloudflare Worker shell and PWA
        run: bun run test:cloudflare-preview
        env:
          DATABASE_URL: file:./db/custom.db
          BANKRESANEH_API_BASE: http://127.0.0.1:3002
          BANKRESANEH_ALLOWED_API_ORIGINS: http://127.0.0.1:3002

      - name: Build the exact Render API Docker image
        run: docker build --pull -f mini-services/api-service/Dockerfile -t bankresaneh-api-preview .
